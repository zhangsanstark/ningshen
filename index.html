<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07080d">
  <meta name="description" content="凝神：七项注意力训练加专注计时。舒尔特方格、Stroop、SART、N-back、多目标追踪、限时心算、呼吸计数。">
  <title>凝神</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <script>
    // 在首屏绘制前定好明暗主题，避免闪烁。默认深色
    (function () {
      var t = 'dark';
      try { t = (JSON.parse(localStorage.getItem('zzl.v1') || '{}').settings || {}).theme || 'dark'; } catch (e) { }
      if (t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
  <header class="top">
    <a class="brand" href="#/" aria-label="凝神 首页">
      <svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <defs><linearGradient id="bm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cff"/><stop offset=".5" stop-color="#4f8cff"/><stop offset="1" stop-color="#2fe3d0"/></linearGradient></defs>
        <circle cx="16" cy="16" r="12" stroke="url(#bm)" stroke-width="4"/>
        <circle cx="16" cy="16" r="4" fill="url(#bm)"/>
      </svg>
      凝神
    </a>
    <nav class="nav" aria-label="主导航">
      <a href="#/" data-page="home">训练</a>
      <a href="#/focus" data-page="focus">专注</a>
      <a href="#/stats" data-page="stats">记录</a>
      <a href="#/about" data-page="about">说明</a>
    </nav>
    <button class="tool" id="theme-btn" aria-label="切换明暗主题"></button>
  </header>
  <main id="app"></main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
